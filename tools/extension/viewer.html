<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>circle viewer</title>
  <link rel="icon" href="assets/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="viewer-page">
  <header class="browser-header">
    <button id="backButton" class="icon-button" type="button" title="Back" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 6 9 12l6 6"></path>
      </svg>
    </button>
    <div class="browser-url">
      <span class="protocol-badge fixed">oct://</span>
      <span id="displayUrl">loading</span>
    </div>
    <button id="refreshButton" class="icon-button" type="button" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12a9 9 0 0 1-15.4 6.36"></path>
        <path d="M3 12A9 9 0 0 1 18.4 5.64"></path>
        <path d="M18 2v4h-4"></path>
        <path d="M6 22v-4h4"></path>
      </svg>
    </button>
  </header>

  <section id="loadingState" class="viewer-state">
    <div class="spinner"></div>
    <h1>Opening circle</h1>
    <p>Fetching resource from the active Octra RPC.</p>
  </section>

  <section id="passphraseState" class="viewer-state hidden">
    <h1>Sealed circle</h1>
    <p>This resource requires a passphrase before Chrome can render it.</p>
    <form id="passphraseForm" class="form-stack compact">
      <label>
        <span>Passphrase</span>
        <input id="passphraseInput" type="password" autocomplete="current-password" placeholder="Enter passphrase">
      </label>
      <button class="primary-button" type="submit">Open circle</button>
    </form>
  </section>

  <section id="errorState" class="viewer-state hidden">
    <h1>Unable to open circle</h1>
    <p id="errorMessage"></p>
    <div class="button-row">
      <button id="retryButton" class="small-button" type="button">Retry</button>
      <button id="copyButton" class="small-button neutral" type="button">Copy oct:// URL</button>
    </div>
  </section>

  <iframe id="circleFrame" class="circle-frame hidden"></iframe>

  <script type="module" src="src/viewer.js"></script>
</body>
</html>
